[project]
name = "pmtwin"
version = "0.1.0"
description = "Digital twin for predictive maintenance on NASA C-MAPSS: anomaly + RUL per engine"
authors = [
    { name = "adi-mauryaji", email = "aditya1925011@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pmtwin = "pmtwin:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
train = [
    "mlflow>=3.18.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.15.0",
]
